services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: siren
      POSTGRES_USER: siren_user
      POSTGRES_PASSWORD: change_this_local_password
    ports:
      - "5432:5432"
    volumes:
      - siren_postgres_data:/var/lib/postgresql/data
      - ./database/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siren_user -d siren"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  siren_postgres_data:
